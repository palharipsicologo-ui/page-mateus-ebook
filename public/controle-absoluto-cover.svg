  <rect width="900" height="1300" fill="url(#bg)"/>
  <rect x="28" y="28" width="844" height="1244" rx="6" fill="none" stroke="#c99b45" stroke-opacity=".28"/>
  <rect width="900" height="1300" fill="url(#glow)"/>

  <g opacity=".5" fill="none" stroke-linecap="round">
    <path d="M-70 1030 C130 905 205 980 354 900 C531 804 656 864 985 670" stroke="#c99b45" stroke-opacity=".22" stroke-width="40"/>
    <path d="M-20 1138 C190 1008 303 1086 460 1003 C632 912 752 946 955 841" stroke="#f4dfa3" stroke-opacity=".08" stroke-width="64"/>
    <path d="M60 100 C190 182 260 163 390 115 C512 70 665 87 840 190" stroke="#c99b45" stroke-opacity=".08" stroke-width="42"/>
  </g>

  <text x="450" y="108" text-anchor="middle" fill="#c99b45" font-size="20" font-family="Arial, Helvetica, sans-serif" letter-spacing="6">UM PERCURSO PRÁTICO DE 30 DIAS</text>
  <text x="450" y="164" text-anchor="middle" fill="#efe6d5" font-size="30" font-family="Georgia, serif" letter-spacing="4">PROTOCOLO</text>

  <g filter="url(#shadow)">
    <g clip-path="url(#kingClip)">
      <rect x="250" y="315" width="400" height="675" fill="url(#kingBlack)"/>
      <path d="M318 400 C410 480 429 574 512 662 C557 710 560 804 615 886" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round"/>
      <path d="M590 380 C522 458 532 524 462 603 C405 666 425 729 359 807" fill="none" stroke="#d2a456" stroke-width="8" stroke-linecap="round"/>
      <path d="M339 721 C410 739 438 789 475 848 C498 884 548 903 582 947" fill="none" stroke="#8a6228" stroke-width="7" stroke-linecap="round"/>
      <path d="M487 346 C478 415 452 456 449 514 C446 561 475 580 469 636" fill="none" stroke="#edcf86" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity=".9">
      <rect x="425" y="345" width="50" height="105" rx="8"/>
      <rect x="382" y="378" width="136" height="42" rx="8"/>
      <path d="M360 458 C392 438 508 438 540 458 C572 485 570 531 529 552 C500 567 400 567 371 552 C330 531 328 485 360 458Z"/>
      <rect x="338" y="547" width="224" height="38" rx="19"/>
      <path d="M405 585 C404 654 391 713 351 790 L549 790 C509 713 496 654 495 585Z"/>
      <rect x="326" y="785" width="248" height="38" rx="19"/>
      <path d="M310 825 C278 844 267 878 284 902 C306 934 357 947 450 947 C543 947 594 934 616 902 C633 878 622 844 590 825Z"/>
      <rect x="278" y="902" width="344" height="55" rx="26"/>
    </g>
  </g>

  <text x="450" y="1040" text-anchor="middle" fill="#f4dfa3" font-size="74" font-weight="700" font-family="Georgia, serif">CONTROLE</text>
  <text x="450" y="1120" text-anchor="middle" fill="#f4dfa3" font-size="74" font-weight="700" font-family="Georgia, serif">ABSOLUTO</text>
  <line x1="400" x2="500" y1="1163" y2="1163" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <text x="450" y="1210" text-anchor="middle" fill="#c8bda9" font-size="20" font-family="Arial, Helvetica, sans-serif">Desenvoltura sexual. Percepção, posições e condução em parceria.</text>
  <text x="450" y="1250" text-anchor="middle" fill="#c99b45" font-size="17" font-family="Arial, Helvetica, sans-serif" letter-spacing="5">O MAESTRO</text>
</svg>
