<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" role="img" aria-labelledby="title desc">
  <title id="title">Protocolo Controle Absoluto</title>
  <desc id="desc">Capa preta e dourada com peça de rei de xadrez.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090807"/>
      <stop offset="0.48" stop-color="#17110b"/>
      <stop offset="1" stop-color="#050504"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="48%" r="55%">
      <stop offset="0" stop-color="#c99b45" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c99b45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4dfa3"/>
      <stop offset=".45" stop-color="#c99b45"/>
      <stop offset="1" stop-color="#79531f"/>
    </linearGradient>
    <linearGradient id="kingBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070605"/>
      <stop offset=".42" stop-color="#241b11"/>
      <stop offset=".72" stop-color="#050504"/>
      <stop offset="1" stop-color="#17110b"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".75"/>
    </filter>
    <clipPath id="kingClip">
      <rect x="425" y="345" width="50" height="105" rx="8"/>
      <rect x="382" y="378" width="136" height="42" rx="8"/>
      <path d="M360 458 C392 438 508 438 540 458 C572 485 570 531 529 552 C500 567 400 567 371 552 C330 531 328 485 360 458Z"/>
      <rect x="338" y="547" width="224" height="38" rx="19"/>
      <path d="M405 585 C404 654 391 713 351 790 L549 790 C509 713 496 654 495 585Z"/>
      <rect x="326" y="785" width="248" height="38" rx="19"/>
      <path d="M310 825 C278 844 267 878 284 902 C306 934 357 947 450 947 C543 947 594 934 616 902 C633 878 622 844 590 825Z"/>
      <rect x="278" y="902" width="344" height="55" rx="26"/>
