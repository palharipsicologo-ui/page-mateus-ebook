<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" role="img" aria-labelledby="title desc">
  <title id="title">Protocolo Dopamina Reset</title>
  <desc id="desc">Capa premium preta e dourada do bônus Dopamina Reset, com rei de xadrez e seta circular.</desc>
  <defs>
